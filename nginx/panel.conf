# nginx/panel.conf
# Reverse proxy for panel.retano360.com -> Gunicorn (web service, port 8000).
#
# HTTP-ONLY VERSION — active by default. DNS for panel.retano360.com is not
# yet pointed at this server (LimooHost manages retano360.com's DNS zone —
# see chat context), so certbot's HTTP-01 challenge cannot succeed until
# that A record is updated. Once DNS resolves correctly to this server's
# IP, uncomment the HTTPS server block below and follow the certbot steps
# in the comment at the bottom of this file.

server {
    listen 80;
    listen [::]:80;
    server_name panel.retano360.com;

    client_max_body_size 100M;  # Excel upload files (customers/products/coupons)

    # Reserved path for certbot's HTTP-01 challenge once TLS is set up.
    # Harmless to leave in place even before then.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upload endpoints (customers/products/coupons) accept large
        # multipart files and the view itself only needs to enqueue a
        # Celery task quickly, but raise timeouts generously anyway in
        # case of slow client upload speeds.
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# HTTPS VERSION — uncomment this whole block once DNS is confirmed pointed
# at this ParsPack server's IP. Steps to activate:
#
#   1. Confirm DNS: from your Windows machine run
#        nslookup panel.retano360.com
#      and check the returned IP matches the ParsPack server's IP shown in
#      the ParsPack panel.
#
#   2. In docker-compose.yml, uncomment the "443:443" port line and the two
#      certbot volume lines under the nginx service.
#
#   3. Get the initial certificate (one-time, before the HTTPS block below
#      is live) by running, on the ParsPack server:
#        docker compose run --rm --entrypoint "\
#          certbot certonly --webroot -w /var/www/certbot \
#          -d panel.retano360.com --email you@example.com \
#          --agree-tos --no-eff-email" certbot
#      (add a `certbot` service using the `certbot/certbot` image to
#      docker-compose.yml first, sharing the same ./nginx/certbot volumes)
#
#   4. Uncomment the server block below, comment out or remove the `listen 80`
#      "location /" proxy block above (keep the acme-challenge location for
#      renewals), then `docker compose restart nginx`.
#
#   5. Certbot auto-renewal: add a cron job / systemd timer on the host, or a
#      `certbot renew` loop in the certbot container, running every 12h.
# ─────────────────────────────────────────────────────────────────────────────

