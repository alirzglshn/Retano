            $ref: '#/components/schemas/SalesRangeBucket'
          description: 'Always exactly 4 buckets in this fixed order: 0_to_0.5m, 0.5_to_1m,
            1_to_3m, above_3m. Every order in the tenant''s entire history counts
            exactly once, in tomans.'
      required:
      - buckets
    SampleFilesResponse:
      type: object
      properties:
        customers:
          type: string
          format: uri
          description: Absolute URL to the sample customers .xlsx.
        products:
          type: string
          format: uri
          description: Absolute URL to the sample products .xlsx.
        coupons:
          type: string
          format: uri
          description: Absolute URL to the sample coupons .xlsx.
      required:
      - coupons
      - customers
      - products
    SegmentEntry:
      type: object
      properties:
        segment:
          $ref: '#/components/schemas/SegmentEnum'
        label:
          type: string
          description: Persian label for this segment.
        count:
          type: integer
        percentage:
          type: number
          format: double
          description: Rounded to 2 decimal places.
      required:
      - count
      - label
      - percentage
      - segment
    SegmentEnum:
      enum:
      - vip
      - active
      - new
      - at_risk
      - churned
      type: string
      description: |-
        * `vip` - vip
        * `active` - active
        * `new` - new
        * `at_risk` - at_risk
        * `churned` - churned
    SegmentsResponse:
      type: object
      properties:
        total_users:
          type: integer
          description: Sum of all 5 segment counts (only users with a non-null rfm_segment).
        segments:
          type: array
          items:
            $ref: '#/components/schemas/SegmentEntry'
          description: Always exactly 5 entries in a fixed order (vip, active, new,
            at_risk, churned), zero-filled for empty segments.
      required:
      - segments
      - total_users
    SendMessageRequest:
      type: object
      description: Write shape — body only. Everything else is derived server-side.
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 5000
      required:
      - body
    SenderTypeEnum:
      enum:
      - tenant
      - support
      type: string
      description: |-
        * `tenant` - Tenant
        * `support` - Support
    SmsPurchaseRequestRequest:
      type: object
      description: |-
        Write shape for POST /api/v1/sms/purchase-request/.

        All pricing (discount_percent, unit_price, total_price, final_price)
        is calculated on the frontend and accepted here only to be relayed
        to support in the chat message — the backend never recalculates or
        trusts these numbers for anything billing-related. They are optional
        precisely because the backend's only real requirement is the SMS
        quantity; the rest is convenience context for the support agent.
      properties:
        sms_count:
          type: integer
          minimum: 1
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        discount_percent:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
        discount_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        final_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
      required:
      - sms_count
    StatusDecEnum:
      enum:
      - error
      type: string
      description: '* `error` - error'
    SupportThreadNotFoundResponse:
      type: object
      description: 404 response for the staff-only SupportChatView when tenant_id
        does not exist.
      properties:
        detail:
          type: string
          default: Tenant not found.
    SyncApiKeyGenerated:
      type: object
      description: |-
        Response body for POST /api/v1/sync-conf/generate-key/

        api_key is returned EXACTLY ONCE — the raw value is never retrievable
        again after this response. The frontend must show/copy it immediately
        (matches the second screenshot's "دریافت API" / copy-to-clipboard UI).
      properties:
        api_key:
          type: string
        api_key_prefix:
          type: string
        generated_at:
          type: string
          format: date-time
      required:
      - api_key
      - api_key_prefix
      - generated_at
    SyncApiKeyMappingIncompleteResponse:
      type: object
      description: |-
        400 response for POST /api/v1/sync-conf/generate-key/ when one or
        more of the 17 mapping rows is missing or incomplete. Hand-built
        Response(), not routed through custom_exception_handler.
      properties:
        status:
          $ref: '#/components/schemas/StatusDecEnum'
        error_type:
          $ref: '#/components/schemas/SyncApiKeyMappingIncompleteResponseErrorTypeEnum'
        message:
          type: string
        missing_fields:
          type: array
          items:
            type: string
          description: e.g. ["user.phone_number", "product.product_link"].
      required:
      - error_type
      - message
      - missing_fields
      - status
    SyncApiKeyMappingIncompleteResponseErrorTypeEnum:
      enum:
      - mapping_incomplete
      type: string
      description: '* `mapping_incomplete` - mapping_incomplete'
    SyncConfigFetch:
      type: object
      description: |-
        Response for GET /api/v1/sync/config/

        Shape the ETL consumes to build its queries:
            {
              "batch_size": 1000,
              "mapping": {
                "user": {
                  "internal_user_id":   {"table": "customers", "column": "cust_id"},
                  "first_name":         {"table": "customers", "column": "First_Name"},
                  ...
                },
                "product": {
                  "internal_product_id": {"table": "products", "column": "id"},
                  ...
                }
              },
              "nullable_fields": {
                "product": ["first_product_attribute", "second_product_attribute"]
              }
            }

        nullable_fields tells the ETL which fields it is allowed to treat as
        "column not found → send null for this field, keep going" during its
        own pre-flight schema check, instead of aborting the whole run.
      properties:
        batch_size:
          type: integer
        mapping:
          type: object
          additionalProperties: {}
        nullable_fields:
          type: object
          additionalProperties: {}
      required:
      - batch_size
      - mapping
      - nullable_fields
    SyncConfigMappingBulkRequest:
      type: object
      description: |-
        Body for PUT /api/v1/sync-conf/mapping/

        {
            "mappings": [
                {"entity": "user", "field_name": "first_name",
                 "client_table": "customers", "client_column": "First_Name"},
                ...
            ]
        }

        All fields for BOTH entities must be present in a single call — this
        endpoint replaces the tenant's entire mapping atomically so the UI's
        "save everything on the page at once" interaction maps directly onto
        one request. Partial saves (e.g. only the user rows) are rejected,
        since تولید API needs to validate completeness across both entities
        together and a partial save would leave the mapping in a state that
        is ambiguous to reason about between requests.
      properties:
        mappings:
          type: array
          items:
            $ref: '#/components/schemas/SyncFieldMappingRequest'
      required:
      - mappings
    SyncConfigStatus:
      type: object
      description: Read-only status shown at the top of the تنظیم API page.
      properties:
        is_enabled:
          type: boolean
          description: Whether the ETL is permitted to sync for this tenant. Set True
            only after تولید API has succeeded (i.e. a key exists and every required
            field mapping row is complete).
        api_key_prefix:
          type: string
          nullable: true
          description: First 12 chars of the raw key, kept for display only (e.g.
            'rsk_3f9a1c7b'). Never sufficient to authenticate.
          maxLength: 12
        api_key_generated_at:
          type: string
          format: date-time
          nullable: true
        batch_size:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Max rows per POST from the ETL to the data ingest endpoints.
        latest_run_status:
          type: string
          readOnly: true
        latest_run_message:
          type: string
          readOnly: true
      required:
      - latest_run_message
      - latest_run_status
    SyncFieldMappingEntityEnum:
      enum:
      - user
      - product
      type: string
      description: |-
        * `user` - User
        * `product` - Product
    SyncFieldMappingListResponse:
      type: object
      description: |-
        GET /api/v1/sync-conf/mapping/ — always returns exactly 17 rows (10
        user fields + 7 product fields), including rows that have never been
        saved (represented with empty client_table/client_column and
        is_filled=false), so the frontend can render every rectangle on
        first page load.
      properties:
        mappings:
          type: array
          items:
            $ref: '#/components/schemas/SyncFieldMappingRow'
      required:
      - mappings
    SyncFieldMappingRequest:
      type: object
      properties:
        entity:
          $ref: '#/components/schemas/SyncFieldMappingEntityEnum'
        field_name:
          type: string
          minLength: 1
          description: One of our canonical field names, see core/sync/field_registry.py
          maxLength: 100
        client_table:
          type: string
          maxLength: 255
        client_column:
          type: string
          maxLength: 255
      required:
      - entity
      - field_name
    SyncFieldMappingRow:
      type: object
      properties:
        entity:
          $ref: '#/components/schemas/SyncFieldMappingRowEntityEnum'
        field_name:
          type: string
          description: Canonical field name from core.sync.field_registry.FIELD_REGISTRY.
        client_table:
          type: string
          description: Empty string if not yet configured.
        client_column:
          type: string
          description: Empty string if not yet configured.
        is_filled:
          type: boolean
          description: True only when both client_table and client_column are non-blank.
      required:
      - client_column
      - client_table
      - entity
      - field_name
      - is_filled
    SyncFieldMappingRowEntityEnum:
      enum:
      - user
      - product
      type: string
      description: |-
        * `user` - user
        * `product` - product
    SyncFieldMappingSavedResponse:
      type: object
      description: 200 response for PUT /api/v1/sync-conf/mapping/ on success.
      properties:
        message:
          type: string
          default: نگاشت ستون‌ها با موفقیت ذخیره شد.
    SyncIngestResponse:
      type: object
      description: |-
        200 response shared by POST /api/v1/sync/data/users/ and
        POST /api/v1/sync/data/products/. Mirrors
        core.services.sync_pipeline.IngestResult.as_dict() exactly.

        Rejections are per-ROW, not per-batch — a batch with some rejected
        rows still returns 200, not a 4xx. rows_rejected + rows_accepted
        always equals rows_received.
      properties:
        rows_received:
          type: integer
        rows_accepted:
          type: integer
        rows_rejected:
          type: integer
        rejections:
          type: array
          items:
            $ref: '#/components/schemas/SyncRowRejection'
      required:
      - rejections
      - rows_accepted
      - rows_received
      - rows_rejected
    SyncReportRecordedResponse:
      type: object
      description: 201 response for POST /api/v1/sync/report/.
      properties:
        message:
          type: string
          default: Report recorded.
    SyncReportRequest:
      type: object
      description: |-
        Body for POST /api/v1/sync/report/

        Two shapes depending on what the ETL is reporting:

        Pre-flight schema failure (ETL never called the data endpoints at all):
            {
                "status": "failed",
                "failure_stage": "schema_table" | "schema_column",
                "failure_detail": "table 'customres' not found"
            }

        Final run outcome (after calling the data endpoints, success or
        partial success — rows_* figures already known to the ETL from the
        data endpoints' own responses, sent back here purely for the audit
        log / تنظیم API status display):
            {
                "status": "success" | "partial",
                "users_rows_received": 5000, "users_rows_accepted": 4998, "users_rows_rejected": 2,
                "products_rows_received": 300, "products_rows_accepted": 300, "products_rows_rejected": 0
            }
      properties:
        status:
          $ref: '#/components/schemas/SyncReportStatusEnum'
        failure_stage:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/FailureStageEnum'
          - $ref: '#/components/schemas/NullEnum'
        failure_detail:
          type: string
          default: ''
        users_rows_received:
          type: integer
          default: 0
        users_rows_accepted:
          type: integer
          default: 0
        users_rows_rejected:
          type: integer
          default: 0
        products_rows_received:
          type: integer
          default: 0
        products_rows_accepted:
          type: integer
          default: 0
        products_rows_rejected:
          type: integer
          default: 0
      required:
      - status
    SyncReportStatusEnum:
      enum:
      - success
      - partial
      - failed
      type: string
      description: |-
        * `success` - success
        * `partial` - partial
        * `failed` - failed
    SyncRowRejection:
      type: object
      properties:
        index:
          type: integer
          description: 0-based index of this row within the submitted batch.
        internal_id:
          type: string
          nullable: true
          description: internal_user_id or internal_product_id of the rejected row,
            if it was present.
        field:
          type: string
          description: Name of the field whose coercion failed.
        reason:
          type: string
          description: Human-readable coercion failure reason.
      required:
      - field
      - index
      - internal_id
      - reason
    TenantMissingResponse:
      type: object
      description: |-
        403 response shared by every reports/* view and DashboardView when
        request.user.tenant does not exist (e.g. a superuser created without
        the Tenant-creation signal firing). Like
        TrendsBadGranularityResponseSerializer above, this is a hand-built
        Response({"detail": ...}, 403) that does NOT go through
        custom_exception_handler — documented as its actual shape, not the
        standard error envelope.
      properties:
        detail:
          type: string
          default: Tenant record not found for this user.
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    TrendsBadGranularityResponse:
      type: object
      description: |-
        400 response when ?granularity= is anything other than 'year' or
        'month'. NOTE: this endpoint builds this Response() by hand and does
        NOT go through core.exceptions.custom_exception_handler — the shape
        is genuinely just {"detail": "..."}, not the standard {error,
        status_code, message, details} envelope. Documented here exactly as
        it actually behaves.
      properties:
        detail:
          type: string
          default: granularity must be 'year' or 'month'.
    TrendsMonthPoint:
      type: object
      properties:
        jalali_year:
          type: integer
        jalali_month:
          type: integer
          description: 1-12.
        month_name:
          type: string
          description: Persian month name, e.g. 'اردیبهشت'.
        customer_count:
          type: integer
        revenue:
          type: number
          format: double
          description: Tomans.
        clv:
          type: number
          format: double
          description: revenue / customer_count for this month.
      required:
      - clv
      - customer_count
      - jalali_month
      - jalali_year
      - month_name
      - revenue
    TrendsMonthlyResponse:
      type: object
      description: Returned when ?granularity=month.
      properties:
        granularity:
          $ref: '#/components/schemas/TrendsMonthlyResponseGranularityEnum'
        data:
          type: array
          items:
            $ref: '#/components/schemas/TrendsMonthPoint'
          description: 'Exactly 6 points: the last 6 Jalali months including the current
            month, oldest first.'
      required:
      - data
      - granularity
    TrendsMonthlyResponseGranularityEnum:
      enum:
      - month
      type: string
      description: '* `month` - month'
    TrendsResponse:
      oneOf:
      - $ref: '#/components/schemas/TrendsYearlyResponse'
      - $ref: '#/components/schemas/TrendsMonthlyResponse'
      discriminator:
        propertyName: granularity
        mapping:
          year: '#/components/schemas/TrendsYearlyResponse'
          month: '#/components/schemas/TrendsMonthlyResponse'
    TrendsYearPoint:
      type: object
      properties:
        jalali_year:
          type: integer
        customer_count:
          type: integer
        revenue:
          type: number
          format: double
          description: Tomans.
        clv:
          type: number
          format: double
          description: revenue / customer_count for this year.
      required:
      - clv
      - customer_count
      - jalali_year
      - revenue
    TrendsYearlyResponse:
      type: object
      description: Returned when ?granularity=year (the default — no query param sent).
      properties:
        granularity:
          $ref: '#/components/schemas/TrendsYearlyResponseGranularityEnum'
        data:
          type: array
          items:
            $ref: '#/components/schemas/TrendsYearPoint'
          description: 'Exactly 4 points: the last 4 Jalali years ending at the current
            Jalali year, oldest first. Zero-filled for years with no orders — this
            is a fixed 4-year window, not the tenant''s full order history.'
      required:
      - data
      - granularity
    TrendsYearlyResponseGranularityEnum:
      enum:
      - year
      type: string
      description: '* `year` - year'
    UnreadCountResponse:
      type: object
      properties:
        unread_count:
          type: integer
          description: Support-sent messages created after the tenant's last chat
            visit. Polling this endpoint does NOT reset the badge — only GET /api/v1/tickets/chat/
            does that.
      required:
      - unread_count
    UploadAcceptedResponse:
      type: object
      description: 202 response shared by all three upload endpoints on successful
        enqueue.
      properties:
        status:
          $ref: '#/components/schemas/UploadAcceptedResponseStatusEnum'
        job_id:
          type: string
          format: uuid
        status_url:
          type: string
          description: Relative path — poll this with GET to track progress, e.g.
            /api/v1/uploads/jobs/<job_id>/.
        message:
          type: string
          description: Persian confirmation message.
      required:
      - job_id
      - message
      - status
      - status_url
    UploadAcceptedResponseStatusEnum:
      enum:
      - accepted
      type: string
      description: '* `accepted` - accepted'
    UploadErrorResponse:
      type: object
      description: |-
        400 response shared by all three upload endpoints (customers, products,
        coupons) for file_error, mapping_error, and (coupons only)
        duplicate_coupon_error. Hand-built Response(), not routed through
        custom_exception_handler — rows_processed/rows_saved are always 0
        here since the error occurs before any row is read.
      properties:
        status:
          $ref: '#/components/schemas/StatusDecEnum'
        error_type:
          $ref: '#/components/schemas/UploadErrorResponseErrorTypeEnum'
        message:
          type: string
          description: Persian, user-facing error message.
        rows_processed:
          type: integer
          default: 0
        rows_saved:
          type: integer
          default: 0
      required:
      - error_type
      - message
      - status
    UploadErrorResponseErrorTypeEnum:
      enum:
      - file_error
      - mapping_error
      - duplicate_coupon_error
      type: string
      description: |-
        * `file_error` - file_error
        * `mapping_error` - mapping_error
        * `duplicate_coupon_error` - duplicate_coupon_error
    UploadJobNotFoundResponse:
      type: object
      description: |-
        404 response for GET /api/v1/uploads/jobs/{job_id}/ when the job does
        not exist or does not belong to the requesting tenant. NOTE: this is
        a DIFFERENT shape than UploadErrorResponseSerializer above (no
        error_type / rows_processed / rows_saved) and does not go through
        custom_exception_handler — it is a hand-built Response({"status":
        "error", "message": ...}, 404).
      properties:
        status:
          $ref: '#/components/schemas/StatusDecEnum'
        message:
          type: string
          default: Job not found.
      required:
      - status
    UploadJobStatusResponse:
      type: object
      description: GET /api/v1/uploads/jobs/{job_id}/ — mirrors UploadJob.to_status_dict()
        exactly.
      properties:
        job_id:
          type: string
          format: uuid
        upload_type:
          $ref: '#/components/schemas/UploadTypeEnum'
        status:
          $ref: '#/components/schemas/UploadJobStatusResponseStatusEnum'
        total_rows:
          type: integer
          nullable: true
          description: Null until the worker has finished counting rows in the file.
        processed_rows:
          type: integer
        rows_saved:
          type: integer
        progress_percentage:
          type: number
          format: double
          description: min(processed_rows, total_rows) / total_rows * 100, rounded
            to 2dp. 0.0 while total_rows is still null.
        error_type:
          type: string
          nullable: true
        message:
          type: string
          description: Persian status/result message.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - created_at
      - error_type
      - job_id
      - message
      - processed_rows
      - progress_percentage
      - rows_saved
      - status
      - total_rows
      - updated_at
      - upload_type
    UploadJobStatusResponseStatusEnum:
      enum:
      - queued
      - processing
      - success
      - partial
      - failed
      type: string
      description: |-
        * `queued` - queued
        * `processing` - processing
        * `success` - success
        * `partial` - partial
        * `failed` - failed
    UploadTypeEnum:
      enum:
      - customers
      - products
      - coupons
      type: string
      description: |-
        * `customers` - customers
        * `products` - products
        * `coupons` - coupons
    ValueUnitEnum:
      enum:
      - روز
      - تومان
      type: string
      description: |-
        * `روز` - روز
        * `تومان` - تومان
    YearlyRetentionPoint:
      type: object
      description: |-
        One entry of core.utils.analytics.get_yearly_retention(). Shared by
        DashboardView's "monthly_trends" key (name is a known misnomer — the
        data is yearly, not monthly) and RetentionReportView's "years" key.
      properties:
        jalali_year:
          type: integer
        customers:
          type: integer
          description: Distinct customers with >=1 order in this Jalali year.
        retained:
          type: integer
          description: Of those customers, how many also ordered in jalali_year +
            1.
        retention_rate_percent:
          type: number
          format: double
        churn_rate_percent:
          type: number
          format: double
          description: 100 - retention_rate_percent.
      required:
      - churn_rate_percent
      - customers
      - jalali_year
      - retained
      - retention_rate_percent
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    syncApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: Tenant Sync API Key
      description: 'Per-tenant sync API key for the ETL-facing endpoints under /api/v1/sync/
        (config fetch, data ingest, run reporting). This is NOT a JWT and is unrelated
        to the jwtAuth scheme used by every other endpoint in this API. Generate a
        key from the human-facing POST /api/v1/sync-conf/generate-key/ endpoint (JWT-authenticated),
        then supply it here as: Authorization: Bearer <api_key>. The key is enabled
        only after every field mapping row has been completed on the API-Conf page;
        a disabled or unknown key returns 401.'
