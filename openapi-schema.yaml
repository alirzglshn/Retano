    DashboardCampaignCounts:
      type: object
      properties:
        total:
          type: integer
        active:
          type: integer
          description: is_active=True AND campaign_start_date <= today <= campaign_end_date.
        ended:
          type: integer
          description: campaign_end_date < today, regardless of is_active.
        deleted:
          type: integer
          description: is_active=False (soft-delete flag; the row is never hard-deleted).
      required:
      - active
      - deleted
      - ended
      - total
    DashboardCustomerCounts:
      type: object
      properties:
        active:
          type: integer
          description: rfm_segment IN ('vip', 'new', 'active').
        inactive:
          type: integer
          description: rfm_segment IN ('churned', 'at_risk').
        total:
          type: integer
          description: active + inactive.
      required:
      - active
      - inactive
      - total
    DashboardRFMSegments:
      type: object
      description: |-
        Always all 5 keys, zero-filled — unlike SegmentsReportView, this is a
        flat dict of segment -> count, not a list of {segment, label, count,
        percentage} objects. The two endpoints intentionally differ in shape;
        do not assume they match.
      properties:
        vip:
          type: integer
        active:
          type: integer
        new:
          type: integer
        at_risk:
          type: integer
        churned:
          type: integer
      required:
      - active
      - at_risk
      - churned
      - new
      - vip
    DashboardResponse:
      type: object
      description: |-
        GET /api/v1/dashboard/ — full response shape. Cached server-side for
        60 seconds per tenant; a cached response is byte-for-byte identical
        to a freshly computed one, so this schema applies either way.
      properties:
        campaigns:
          $ref: '#/components/schemas/DashboardCampaignCounts'
        customers:
          $ref: '#/components/schemas/DashboardCustomerCounts'
        monthly_sales:
          type: number
          format: double
          description: Sum of order totals for the current Jalali month, in tomans.
        top_products:
          type: array
          items:
            $ref: '#/components/schemas/DashboardTopProduct'
        monthly_trends:
          type: array
          items:
            $ref: '#/components/schemas/YearlyRetentionPoint'
          description: 'NOTE: despite the key name, this is YEARLY retention/churn
            data (same shape and same underlying function as GET /api/v1/reports/retention/''s
            "years" key), not monthly. The most recent year is omitted (no year+1
            data exists yet to measure retention against).'
        rfm_segments:
          $ref: '#/components/schemas/DashboardRFMSegments'
        sms_balance:
          type: integer
          description: CustomUser.num_available_sms for the requesting user.
        support_unread_count:
          type: integer
          description: Unread support-sent messages in this tenant's ticket thread.
      required:
      - campaigns
      - customers
      - monthly_sales
      - monthly_trends
      - rfm_segments
      - sms_balance
      - support_unread_count
      - top_products
    DashboardTopProduct:
      type: object
      properties:
        name:
          type: string
        total_revenue:
          type: number
          format: double
          description: Sum of order_items.subtotal for this product, in tomans.
      required:
      - name
      - total_revenue
    ErrorResponse:
      type: object
      description: |-
        The standard error envelope produced by
        core.exceptions.custom_exception_handler for every RAISED DRF
        exception (ValidationError, NotAuthenticated, PermissionDenied,
        Http404, unhandled 500s, and any APIException subclass such as
        core.exceptions.OTPError / BusinessLogicError / TenantPermissionError).

        Attach this to the 400 / 401 / 403 / 404 / 409 / 429 / 500 responses
        of any endpoint whose errors are raised as exceptions rather than
        hand-built as a Response() (see individual view docstrings in
        core/schema.py for the handful of endpoints that do NOT go through
        this handler — those are documented with their own, different,
        actual shape instead of this one).
      properties:
        error:
          type: boolean
          default: true
          description: Always true on an error response.
        status_code:
          type: integer
          description: Same value as the HTTP status code of this response.
        message:
          type: string
          description: Human-readable summary of what went wrong.
        details:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: 'Field-level validation errors, e.g. {"phone_number": ["This
            field is required."]}. Empty object ({}) when the error has no field-level
            breakdown (e.g. authentication/permission/404 errors).'
      required:
      - message
      - status_code
    FailureStageEnum:
      enum:
      - schema_table
      - schema_column
      - connection
      - ingest
      - unknown
      type: string
      description: |-
        * `schema_table` - schema_table
        * `schema_column` - schema_column
        * `connection` - connection
        * `ingest` - ingest
        * `unknown` - unknown
    GenderEnum:
      enum:
      - آقایان
      - بانوان
      - همه
      type: string
      description: |-
        * `آقایان` - آقایان
        * `بانوان` - بانوان
        * `همه` - همه
    KeyEnum:
      enum:
      - 0_to_0.5m
      - 0.5_to_1m
      - 1_to_3m
      - above_3m
      type: string
      description: |-
        * `0_to_0.5m` - 0_to_0.5m
        * `0.5_to_1m` - 0.5_to_1m
        * `1_to_3m` - 1_to_3m
        * `above_3m` - above_3m
    LogoutRequest:
      type: object
      description: POST /api/v1/auth/logout/ — blacklists the given refresh token.
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    Message:
      type: object
      description: |-
        Read shape for a single message.
        sender_display is the phone number of the sender, or 'support'
        for staff messages — gives the frontend something human-readable
        without exposing internal user IDs.
      properties:
        id:
          type: integer
          readOnly: true
        sender_type:
          allOf:
          - $ref: '#/components/schemas/SenderTypeEnum'
          readOnly: true
        sender_display:
          type: string
          readOnly: true
        body:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - body
      - created_at
      - id
      - sender_display
      - sender_type
    NullEnum:
      enum:
      - null
    OTPRequestRequest:
      type: object
      description: POST /api/v1/auth/otp/request/ — accepts a phone number to OTP.
      properties:
        phone_number:
          type: string
          minLength: 1
      required:
      - phone_number
    OTPRequestResponse:
      type: object
      description: |-
        200 response for POST /api/v1/auth/otp/request/.

        debug_code is ONLY ever present when the server is running with
        OTP_FAKE_MODE=True (see config/settings/development.py) — it is never
        sent by a production deployment. Documented as not required so the
        schema reflects that a client must not assume it will be there.
      properties:
        phone_number:
          type: string
          description: Normalized E.164 form, e.g. +989121234567.
        ttl_seconds:
          type: integer
          description: How long the OTP code remains valid.
        resend_in_seconds:
          type: integer
          description: Client must wait this long before requesting another OTP for
            this number.
        debug_code:
          type: string
          description: DEV/TEST ONLY. Present only when the server has OTP_FAKE_MODE=True.
            Never present in production.
      required:
      - phone_number
      - resend_in_seconds
      - ttl_seconds
    OTPVerifyRequest:
      type: object
      description: |-
        POST /api/v1/auth/otp/verify/

        Verifies the OTP and, on success, issues Simple JWT access/refresh
        tokens. Creates the user on first verification (so verify also acts
        as implicit login-or-register for users who skip /auth/register/).
      properties:
        phone_number:
          type: string
          minLength: 1
        code:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 12
      required:
      - code
      - phone_number
    OTPVerifyResponse:
      type: object
      description: |-
        200 response for POST /api/v1/auth/otp/verify/. Creates the user on
        first successful verification if one does not already exist for this
        phone number (implicit signup) — the response shape is identical
        either way.
      properties:
        user_id:
          type: integer
        phone_number:
          type: string
        access:
          type: string
          description: Simple JWT access token.
        refresh:
          type: string
          description: Simple JWT refresh token.
      required:
      - access
      - phone_number
      - refresh
      - user_id
    PaginatedCampaignListList:
      type: object
