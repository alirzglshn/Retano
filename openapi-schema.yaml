          - $ref: '#/components/schemas/ActivationBaseEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        comparison_type:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/ComparisonTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        comparison_value:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        value_unit:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/ValueUnitEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        buying_power:
          $ref: '#/components/schemas/BuyingPowerEnum'
        customer_type:
          $ref: '#/components/schemas/CustomerTypeEnum'
        gender:
          $ref: '#/components/schemas/GenderEnum'
        first_product_attribute:
          type: string
          title: ویژگی اول محصول
          maxLength: 255
        second_product_attribute:
          type: string
          title: ویژگی دوم محصول
          maxLength: 255
        description:
          type: string
        is_active:
          type: boolean
        message_pattern:
          type: string
          minLength: 1
    PatchedCampaignToggleRequest:
      type: object
      description: Body for PATCH /api/v1/campaigns/{id}/toggle/ — is_active only.
      properties:
        is_active:
          type: boolean
    PatchedProfileRequest:
      type: object
      description: |-
        GET/PATCH /api/v1/profile/

        phone_number is intentionally read-only here: changing the auth
        identifier is a security-sensitive operation (would need its own
        OTP-reverification flow) and is out of scope for this endpoint.

        profile_picture accepts multipart/form-data uploads — the global
        DRF parser config in config/settings/base.py already includes
        MultiPartParser and FormParser alongside JSONParser, so PATCHing
        this field with an image works with no view-level changes.

        business_domain is a fixed set of choices (حوزه کاری dropdown) —
        see BUSINESS_DOMAIN_CHOICES in users/models.py for the current list.
      properties:
        username:
          type: string
          nullable: true
          description: Optional. Kept for Django admin and legacy compatibility. Authentication
            uses phone_number.
          maxLength: 150
        email:
          type: string
          format: email
          nullable: true
          maxLength: 254
        first_name:
          type: string
          nullable: true
          maxLength: 20
        last_name:
          type: string
          nullable: true
          maxLength: 20
        shop_name:
          type: string
          minLength: 1
          maxLength: 255
        website_address:
          type: string
          format: uri
          nullable: true
          maxLength: 500
        position:
          type: string
          nullable: true
          maxLength: 50
        birth_date:
          type: string
          format: date
          nullable: true
        about_me:
          type: string
          nullable: true
        profile_picture:
          type: string
          format: binary
          nullable: true
          description: Optional avatar image shown in the sidebar (عکس پروفایل).
        business_domain:
          nullable: true
          description: |-
            Tenant's business category (حوزه کاری).

            * `fashion_clothing` - مد و لباس
            * `cosmetics_beauty` - لوازم آرایشی و بهداشتی
            * `food_beverage` - غذا و نوشیدنی
            * `home_kitchen` - لوازم خانه و آشپزخانه
            * `digital_electronics` - لوازم دیجیتال و الکترونیک
            * `other` - سایر
          oneOf:
          - $ref: '#/components/schemas/BusinessDomainEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
    PriorityEnum:
      enum:
      - خیلی بالا
      - بالا
      - متوسط
