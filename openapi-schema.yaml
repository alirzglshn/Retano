            application/json:
              schema:
                $ref: '#/components/schemas/SupportThreadNotFoundResponse'
          description: ''
    post:
      operationId: tickets_support_create
      description: Requires request.user.is_staff. 404 if the tenant_id does not exist.
      summary: '[Staff only] Reply to a specific tenant''s thread'
      parameters:
      - in: path
        name: tenant_id
        schema:
          type: integer
        required: true
      tags:
      - Support Chat (Staff)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportThreadNotFoundResponse'
          description: ''
components:
  schemas:
    AccountStatusResponse:
      type: object
      properties:
        user_id:
          type: integer
        phone_number:
          type: string
        phone_verified:
          type: boolean
          description: Always true for any authenticated request in this system —
            reaching this endpoint at all requires a valid JWT, which is only issued
            after OTP verification or registration. There is no 'logged in but unverified'
            state to represent.
        is_premium:
          type: boolean
        has_tenant:
          type: boolean
        profile_complete:
          type: boolean
          description: True iff first_name, last_name, and shop_name are all non-empty.
      required:
      - has_tenant
      - is_premium
      - phone_number
      - phone_verified
      - profile_complete
      - user_id
    ActivationBaseEnum:
      enum:
      - همیشه
      - آخرین خرید
      - اولین خرید
      - یادآوری خرید بعدی
      - قدرت خرید
      type: string
      description: |-
        * `همیشه` - همیشه
        * `آخرین خرید` - آخرین خرید
        * `اولین خرید` - اولین خرید
        * `یادآوری خرید بعدی` - یادآوری خرید بعدی
        * `قدرت خرید` - قدرت خرید
    ActiveUsersResponse:
      type: object
      properties:
        total_users:
          type: integer
        active_count:
          type: integer
        inactive_count:
          type: integer
        active_percent:
          type: number
          format: double
          description: Rounded to 1 decimal place.
        inactive_percent:
          type: number
          format: double
          description: 100.0 - active_percent.
      required:
      - active_count
      - active_percent
      - inactive_count
      - inactive_percent
      - total_users
    BlankEnum:
      enum:
      - ''
    BusinessDomainEnum:
      enum:
      - fashion_clothing
      - cosmetics_beauty
      - food_beverage
      - home_kitchen
      - digital_electronics
      - other
      type: string
      description: |-
        * `fashion_clothing` - مد و لباس
        * `cosmetics_beauty` - لوازم آرایشی و بهداشتی
        * `food_beverage` - غذا و نوشیدنی
        * `home_kitchen` - لوازم خانه و آشپزخانه
        * `digital_electronics` - لوازم دیجیتال و الکترونیک
        * `other` - سایر
    BuyingPowerEnum:
      enum:
      - همه
      - خیلی بالا
      - بالا
      - متوسط
      - پایین
      - خیلی پایین
      type: string
      description: |-
        * `همه` - همه
        * `خیلی بالا` - خیلی بالا
        * `بالا` - بالا
        * `متوسط` - متوسط
        * `پایین` - پایین
        * `خیلی پایین` - خیلی پایین
    Campaign:
      type: object
      description: |-
        Full shape for create/update/retrieve.

        tenant and rule_number are backend-controlled:
            * tenant is set from request.user's tenant in the view, never
              accepted from the client.
            * rule_number is auto-incremented per-tenant in Campaign.save().
      properties:
        id:
          type: integer
          readOnly: true
        tenant:
          type: integer
          readOnly: true
        rule_number:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        coupon_discount_percentage:
          nullable: true
          maximum: 1000
          exclusiveMaximum: true
          minimum: -1000
          exclusiveMinimum: true
          oneOf:
          - $ref: '#/components/schemas/CouponDiscountPercentageEnum'
          - $ref: '#/components/schemas/NullEnum'
        campaign_start_date:
          type: string
          format: date
          nullable: true
        campaign_end_date:
          type: string
          format: date
          nullable: true
        send_sms_time:
          type: string
          format: time
        activation_base:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/ActivationBaseEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        comparison_type:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/ComparisonTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        comparison_value:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        value_unit:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/ValueUnitEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        buying_power:
          $ref: '#/components/schemas/BuyingPowerEnum'
        customer_type:
          $ref: '#/components/schemas/CustomerTypeEnum'
        gender:
          $ref: '#/components/schemas/GenderEnum'
        first_product_attribute:
          type: string
          title: ویژگی اول محصول
          maxLength: 255
        second_product_attribute:
          type: string
          title: ویژگی دوم محصول
          maxLength: 255
        description:
          type: string
        is_active:
          type: boolean
        message_pattern:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - rule_number
      - tenant
    CampaignList:
      type: object
      description: |-
        Condensed shape for GET /api/v1/campaigns/ (list action).

        Intentionally excludes the heavier targeting/messaging fields —
        those only matter once you're looking at a single campaign.
      properties:
        id:
          type: integer
          readOnly: true
        rule_number:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        priority:
          allOf:
          - $ref: '#/components/schemas/PriorityEnum'
          readOnly: true
        campaign_start_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        campaign_end_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - campaign_end_date
      - campaign_start_date
      - created_at
      - description
      - id
      - is_active
      - name
      - priority
      - rule_number
    CampaignMetaResponse:
      type: object
      description: |-
        GET /api/v1/campaigns/meta/

        The response is a dict keyed by field name, not a fixed set of named
        top-level keys — DRF/drf-spectacular has no native way to express
        "object with these exact 8 keys, each a list of {value, label}" other
        than naming each key explicitly, which is what this serializer does.
        All 8 keys are always present.

        coupon_discount_percentage's "value" is an INTEGER (0-100), not a
        string, unlike every other field here where "value" is a string —
        this mirrors Campaign.COUPON_DISCOUNT_PERCENTAGE_CHOICES exactly
        ([(i, f"{i}%") for i in range(0, 101)]).
      properties:
        coupon_discount_percentage:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: '101 entries, one per integer 0-100. Each entry is {"value":
            <int 0-100>, "label": "<int>%"} — value is an integer here, unlike every
            other field below.'
        activation_base:
          type: array
          items:
            $ref: '#/components/schemas/ChoiceOption'
        comparison_type:
          type: array
          items:
            $ref: '#/components/schemas/ChoiceOption'
        value_unit:
          type: array
          items:
            $ref: '#/components/schemas/ChoiceOption'
        gender:
          type: array
          items:
            $ref: '#/components/schemas/ChoiceOption'
        buying_power:
          type: array
          items:
            $ref: '#/components/schemas/ChoiceOption'
        priority:
          type: array
          items:
            $ref: '#/components/schemas/ChoiceOption'
        customer_type:
          type: array
          items:
            $ref: '#/components/schemas/ChoiceOption'
      required:
      - activation_base
      - buying_power
      - comparison_type
      - coupon_discount_percentage
      - customer_type
      - gender
      - priority
      - value_unit
    CampaignRequest:
      type: object
      description: |-
        Full shape for create/update/retrieve.

        tenant and rule_number are backend-controlled:
            * tenant is set from request.user's tenant in the view, never
              accepted from the client.
            * rule_number is auto-incremented per-tenant in Campaign.save().
