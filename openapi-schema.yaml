openapi: 3.0.3
info:
  title: Retano API
  version: 1.0.0
  description: Retano360 — Customer Retention & Campaign Management Platform. All
    endpoints require JWT Bearer authentication unless stated otherwise.
paths:
  /api/v1/campaigns/meta/:
    get:
      operationId: campaigns_meta_retrieve
      description: 'Returns the available options for every <select> on the campaign
        create/edit form: activation_base, comparison_type, value_unit, gender, buying_power,
        priority, customer_type, and coupon_discount_percentage. Does NOT cover first_product_attribute
        / second_product_attribute — those are free-text fields on the Campaign model,
        not choices=, so there is no fixed option set to serve for them.'
      summary: Choice-field options for the campaign create/edit form
      tags:
      - Campaigns
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignMetaResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/campaigns/:
    get:
      operationId: campaigns_list
      description: Paginated, searchable, filterable, orderable list of the authenticated
        tenant's own campaigns. A campaign belonging to a different tenant never appears
        here and never appears at any other campaign endpoint — tenant scoping is
        enforced in get_queryset(), not at the permission layer.
      summary: List campaigns
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
        description: Exact-match filter, e.g. ?is_active=true.
      - in: query
        name: ordering
        schema:
          type: string
        description: 'One of: created_at, name, rule_number. Prefix with - for descending,
          e.g. ?ordering=-created_at (also the default ordering when omitted).'
      - in: query
        name: page
        schema:
          type: integer
        description: 1-based page number.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Items per page. Default 20, maximum 100.
      - in: query
        name: search
        schema:
          type: string
        description: Case-insensitive substring match against `name` only.
      tags:
      - Campaigns
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCampaignListList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
    post:
      operationId: campaigns_create
      description: '`tenant` and `rule_number` are backend-controlled and ignored
        if sent — tenant is always the authenticated user''s own tenant, and rule_number
        auto-increments per tenant.'
      summary: Create a campaign
      tags:
      - Campaigns
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CampaignRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CampaignRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/campaigns/{id}/:
    patch:
      operationId: campaigns_partial_update
      description: |-
        /api/v1/campaigns/                 — list, create
        /api/v1/campaigns/{id}/            — retrieve, update, partial_update, destroy
        /api/v1/campaigns/{id}/toggle/     — PATCH, flips/sets is_active

        Tenant isolation: every queryset is scoped to the requesting user's
        own tenant. A campaign belonging to another tenant is invisible —
        not "403 Forbidden", just a 404, since DRF's get_object() raises
        Http404 when the filtered queryset doesn't contain the pk.
      summary: Partially update a campaign
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Campaigns
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCampaignRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCampaignRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCampaignRequest'
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
    put:
      operationId: campaigns_update
      description: |-
        /api/v1/campaigns/                 — list, create
        /api/v1/campaigns/{id}/            — retrieve, update, partial_update, destroy
        /api/v1/campaigns/{id}/toggle/     — PATCH, flips/sets is_active

        Tenant isolation: every queryset is scoped to the requesting user's
        own tenant. A campaign belonging to another tenant is invisible —
        not "403 Forbidden", just a 404, since DRF's get_object() raises
        Http404 when the filtered queryset doesn't contain the pk.
      summary: Replace a campaign (full update)
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Campaigns
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CampaignRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CampaignRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
    get:
      operationId: campaigns_retrieve
      description: A campaign ID belonging to another tenant returns 404, never 403
        — its existence is not revealed to a tenant that does not own it.
      summary: Retrieve a single campaign
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Campaigns
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/campaigns/{id}/toggle/:
    patch:
      operationId: campaigns_toggle_partial_update
      description: |-
        This is the soft-delete endpoint — 'حذف' in the UI calls this with is_active: false, it never calls DELETE. Two distinct request bodies are accepted:

        - Empty body ({} or omitted entirely): flips is_active to its opposite value.
        - {"is_active": true|false}: sets is_active to exactly that value, regardless of its current value.
      summary: Toggle or set a campaign's is_active flag
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Campaigns
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCampaignToggleRequest'
            examples:
              FlipCurrentValue:
                value: {}
                summary: Flip current value
              SetExplicitly:
                value:
                  is_active: false
                summary: Set explicitly
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCampaignToggleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCampaignToggleRequest'
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignToggle'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/dashboard/:
    get:
      operationId: dashboard_retrieve
      description: |-
        Everything the dashboard page needs in one request: campaign counts, active/inactive customer counts, current-month sales, top 4 products by revenue, yearly retention/churn (see the monthly_trends field's own description for an important naming caveat), RFM segment distribution, SMS balance, and the support unread-message badge count.

        Cached server-side per tenant for 60 seconds — a cache hit returns byte-for-byte the same shape as a fresh computation.
      summary: Single aggregated payload for the دشبورد page
      tags:
      - Dashboard
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantMissingResponse'
          description: ''
  /api/v1/reports/trends/:
    get:
      operationId: reports_trends_retrieve
      description: |-
        Backs THREE charts on the frontend (تعداد مشتریان, میزان فروش, CLV) from a single payload — the frontend picks a different field per chart (customer_count / revenue / clv). There is intentionally one endpoint here, not three.

        Two response shapes depending on ?granularity=, discriminated by the `granularity` field itself in the response body:

        - year (default, omit the param entirely): last 4 Jalali years ending at the current Jalali year, zero-filled for years with no orders. This is a fixed 4-year window, NOT the tenant's full order history.
        - month: re-renders the ENTIRE chart as 6 monthly bars (last 6 Jalali months including the current month) rather than a single value — selecting month mode changes the chart shape per product decision, it does not add a 4th data point to the yearly view.
      summary: Customer count / revenue / CLV trends
      parameters:
      - in: query
        name: granularity
        schema:
          type: string
          enum:
          - month
          - year
          default: year
        description: Selects which of the two response shapes below is returned.
      tags:
      - Reports
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendsResponse'
              examples:
                Yearly(default):
                  value:
                    granularity: year
                    data:
                    - jalali_year: 1402
                      customer_count: 312
                      revenue: 4820000000.0
                      clv: 15448717.95
                    - jalali_year: 1403
                      customer_count: 340
                      revenue: 5010000000.0
                      clv: 14735294.12
                  summary: Yearly (default)
                Monthly(?granularity=month):
                  value:
                    granularity: month
                    data:
                    - jalali_year: 1405
                      jalali_month: 2
                      month_name: اردیبهشت
                      customer_count: 40
                      revenue: 120000000.0
                      clv: 3000000.0
                  summary: Monthly (?granularity=month)
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendsBadGranularityResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantMissingResponse'
          description: ''
  /api/v1/reports/segments/:
    get:
      operationId: reports_segments_retrieve
      description: Only users with a non-null rfm_segment are counted. Always returns
        exactly 5 segments in a fixed order, zero-filled for segments with no users.
      summary: RFM segment distribution (دسته‌بندی RFM)
      tags:
      - Reports
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentsResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantMissingResponse'
          description: ''
  /api/v1/reports/sales-ranges/:
    get:
      operationId: reports_sales_ranges_retrieve
      description: Histogram of individual order totals across the tenant's ENTIRE
        order history (not windowed to any date range), bucketed into 4 fixed ranges
        in tomans. Each order counts exactly once.
      summary: Order-value histogram (بازه‌های فروش)
      tags:
      - Reports
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesRangeResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantMissingResponse'
          description: ''
  /api/v1/reports/active-users/:
    get:
      operationId: reports_active_users_retrieve
      description: active = rfm_segment IN (vip, new, active); inactive = rfm_segment
        IN (churned, at_risk). Only users with a non-null rfm_segment are counted
        — totals here always agree with GET /api/v1/reports/segments/'s total_users.
      summary: Active vs inactive customer percentage (درصد کاربران فعال)
      tags:
      - Reports
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveUsersResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantMissingResponse'
          description: ''
  /api/v1/reports/retention/:
    get:
      operationId: reports_retention_retrieve
      description: Computed via the exact same shared function (core.utils.analytics.get_yearly_retention)
        that the dashboard endpoint's monthly_trends key also calls — the two pages
        can never disagree on this number. The most recent computable year always
        omits its own retention figure (no year+1 data exists yet to measure it against);
        there is no null placeholder for it.
      summary: Yearly retention / churn (نرخ نگهداری / نرخ ریزش)
      tags:
      - Reports
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantMissingResponse'
          description: ''
  /api/v1/uploads/customers/:
    post:
      operationId: uploads_customers_create
      description: |-
        multipart/form-data. One request carries both the file and the full column-mapping. Every _MAPPING_FIELDS entry below is REQUIRED and must be a non-negative integer — the zero-based column index in the uploaded spreadsheet, e.g. customers_first_name=1 means column B holds first names.

        Returns 202 immediately with a job_id; the actual import runs asynchronously on a Celery worker. Poll GET /api/v1/uploads/jobs/{job_id}/ for progress.
      summary: Upload the customers Excel file
      tags:
      - Uploads
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                customers_file:
                  type: string
                  format: binary
                  description: The .xlsx or .xls file.
                customers_internal_id:
                  type: integer
                  description: 'Column index: customer''s unique internal ID.'
                customers_first_name:
                  type: integer
                  description: 'Column index: first name.'
                customers_last_name:
                  type: integer
                  description: 'Column index: last name.'
                customers_internal_order_id:
                  type: integer
                  description: 'Column index: unique internal order ID.'
                customers_order_date:
                  type: integer
                  description: 'Column index: order date. Any common date format is
                    accepted (parsed via a flexible multi-format parser).'
                customers_quantity:
                  type: integer
                  description: 'Column index: quantity ordered.'
                customers_then_product_price:
                  type: integer
                  description: 'Column index: the product''s price AT THE TIME OF
                    PURCHASE (fixed historical value, distinct from the product''s
                    current price in the products file).'
                customers_phone_number:
                  type: integer
                  description: 'Column index: customer''s phone number.'
                customers_internal_product_id:
                  type: integer
                  description: 'Column index: internal product ID — links this row
                    to a row in the products file.'
                customers_gender:
                  type: integer
                  description: 'Column index: customer''s gender.'
              required:
              - customers_file
              - customers_internal_id
              - customers_first_name
              - customers_last_name
              - customers_internal_order_id
              - customers_order_date
              - customers_quantity
              - customers_then_product_price
              - customers_phone_number
              - customers_internal_product_id
              - customers_gender
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadAcceptedResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/uploads/products/:
    post:
      operationId: uploads_products_create
      description: |-
        multipart/form-data. Same one-request pattern as the customers upload. All 7 mapping fields below are REQUIRED, non-negative integer column indices. first_product_attribute and second_product_attribute are stored completely as-is with zero normalization; an empty cell in either column is stored as NULL, never as an empty string.

        Returns 202 immediately with a job_id; poll GET /api/v1/uploads/jobs/{job_id}/ for progress.
      summary: Upload the products Excel file
      tags:
      - Uploads
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                products_file:
                  type: string
                  format: binary
                  description: The .xlsx or .xls file.
                products_internal_product_id:
                  type: integer
                  description: 'Column index: product''s unique internal ID.'
                products_product_name:
                  type: integer
                  description: 'Column index: product name.'
                products_category:
                  type: integer
                  description: 'Column index: product category.'
                products_current_product_price:
                  type: integer
                  description: 'Column index: current price. This is the value used
                    by all analytics/reports going forward, and is expected to be
                    updated over time as prices change (independent of then_product_price
                    on historical orders).'
                products_first_product_attribute:
                  type: integer
                  description: 'Column index: first free-text product attribute. Empty
                    cell -> stored as NULL, not empty string.'
                products_second_product_attribute:
                  type: integer
                  description: 'Column index: second free-text product attribute.
                    Empty cell -> stored as NULL.'
                products_product_link:
                  type: integer
                  description: 'Column index: URL to the product page.'
              required:
              - products_file
              - products_internal_product_id
              - products_product_name
              - products_category
              - products_current_product_price
              - products_first_product_attribute
              - products_second_product_attribute
              - products_product_link
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadAcceptedResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/uploads/coupons/:
    post:
      operationId: uploads_coupons_create
      description: |-
        multipart/form-data. Only 2 mapping fields, both REQUIRED, non-negative integer column indices.

        Pre-flight guard: if the tenant still has ANY unused (status='available') coupons from a previous upload, this endpoint returns 400 with error_type='duplicate_coupon_error' BEFORE the file is even read — a tenant must exhaust all existing coupons before a new coupon file can be uploaded.

        Returns 202 immediately with a job_id; poll GET /api/v1/uploads/jobs/{job_id}/ for progress.
      summary: Upload the coupons Excel file
      tags:
      - Uploads
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                coupons_file:
                  type: string
                  format: binary
                  description: The .xlsx or .xls file.
                coupons_coupon_code:
                  type: integer
                  description: 'Column index: the coupon code string.'
                coupons_discount_percentage:
                  type: integer
                  description: 'Column index: discount percentage, 0-100.'
              required:
              - coupons_file
              - coupons_coupon_code
              - coupons_discount_percentage
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadAcceptedResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/uploads/sample-files/:
    get:
      operationId: uploads_sample_files_retrieve
      description: Returns absolute URLs (built from the current request's host) for
        the three static sample Excel templates, for a 'download template' link in
        the upload UI.
      summary: Get sample Excel template download URLs
      tags:
      - Uploads
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SampleFilesResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/sync-conf/status/:
    get:
      operationId: sync_conf_status_retrieve
      description: is_enabled, masked api_key_prefix, and the outcome of the most
        recent SyncRun. Does not include the mapping rows themselves — see GET /api/v1/sync-conf/mapping/
        for those.
      summary: Get the top-of-page sync status
      tags:
      - Sync Configuration
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncConfigStatus'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/sync-conf/mapping/:
    get:
      operationId: sync_conf_mapping_retrieve
      description: 'Always returns exactly 17 rows: 10 user fields + 7 product fields,
        from core.sync.field_registry.FIELD_REGISTRY. A field never saved yet still
        appears, with client_table/client_column as empty strings and is_filled=false,
        so the frontend can render every rectangle on first page load.'
      summary: Get every field-mapping row (filled or empty)
      tags:
      - Sync Configuration
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncFieldMappingListResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
    put:
      operationId: sync_conf_mapping_update
      description: ALL 17 rows (both entities, every registry field) must be present
        in a single call — a partial save (e.g. only the user rows) is rejected with
        a validation error, because تولید API needs to validate completeness across
        both entities together and a partial save would leave the mapping in an ambiguous
        state between requests. entity must be 'user' or 'product'; field_name must
        exactly match a name in the registry for that entity.
      summary: Replace the entire field mapping atomically
      tags:
      - Sync Configuration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncConfigMappingBulkRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SyncConfigMappingBulkRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SyncConfigMappingBulkRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncFieldMappingSavedResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/sync-conf/generate-key/:
    post:
      operationId: sync_conf_generate_key_create
      description: |-
        The 'تولید API' button. Blocked with 400 (error_type='mapping_incomplete') unless EVERY one of the 17 mapping rows has both client_table and client_column non-blank — this includes first_product_attribute/second_product_attribute, which must still be DECLARED here even though they are the only two fields allowed to gracefully degrade to NULL later if the declared column turns out not to exist at sync time.

        On success: generates a new key (silently invalidating any previous one, since only its hash is stored), enables the SyncConfig, and returns the RAW key EXACTLY ONCE. It is not retrievable again after this response — the frontend must display/copy it immediately.
      summary: Generate (or rotate) the tenant's sync API key
      tags:
      - Sync Configuration
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncApiKeyGenerated'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncApiKeyMappingIncompleteResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/sync/config/:
    get:
      operationId: sync_config_retrieve
      description: |-
        Authenticated with the tenant's sync API key (see the syncApiKeyAuth security scheme), NOT a JWT. The ETL container must call this at the START of every sync cycle rather than caching it — edits made on the تنظیم API page (JWT-authenticated, see core/views_sync_conf.py) take effect on the very next cycle with zero redeployment of the ETL container.

        nullable_fields lists, per entity, which field names may degrade to NULL on a missing/misnamed COLUMN during the ETL's own pre-flight schema check, instead of aborting the whole run. A missing TABLE is always fatal regardless of this list — it only ever applies at column granularity.
      summary: Fetch this tenant's current sync configuration
      tags:
      - Sync (ETL)
      security:
      - syncApiKeyAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncConfigFetch'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/sync/data/users/:
    post:
      operationId: sync_data_users_create
      description: |-
        Authenticated with the tenant's sync API key. Assumes the ETL has ALREADY completed its own pre-flight schema check (table/column existence against the tenant's actual database) before calling this — this endpoint performs per-field, per-row type coercion only, never schema validation, and has no visibility into the tenant's database.

        Row identity is the COMPOSITE (internal_user_id, internal_order_id) — a flat per-order-line table, so the same user appears in many rows, one per order. A row matching an existing (internal_user_id, internal_order_id) pair is treated as an UPDATE to that specific order line, not a new record.

        Coercion failures reject the ROW, not the batch — except for first_product_attribute/second_product_attribute on the product side, where a coercion failure degrades that field to NULL and the row proceeds normally. Always returns 200, even when some or all rows were rejected — check rows_rejected / rejections in the body, not the HTTP status, to detect partial failures.
      summary: Ingest a batch of user/order rows
      tags:
      - Sync (ETL)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                rows:
                  type: array
                  items:
                    type: object
                  maxItems: 20000
                  description: Raw, loosely-typed rows straight from the client's
                    database driver — numbers as numbers, strings as strings, ISO-8601
                    date strings, null for SQL NULL. This endpoint's coercion layer
                    absorbs driver/engine differences; the ETL must NOT pre-coerce
                    types itself.
              required:
              - rows
      security:
      - syncApiKeyAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncIngestResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/sync/data/products/:
    post:
      operationId: sync_data_products_create
      description: Same contract as POST /api/v1/sync/data/users/ — see that endpoint's
        description for the full row-identity / coercion / partial-failure semantics.
        Row identity here is internal_product_id alone (products are not per-order-line).
      summary: Ingest a batch of product rows
      tags:
      - Sync (ETL)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                rows:
                  type: array
                  items:
                    type: object
                  maxItems: 20000
              required:
              - rows
      security:
      - syncApiKeyAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncIngestResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/sync/report/:
    post:
      operationId: sync_report_create
      description: |-
        Call exactly once per sync cycle, in one of two situations:

        1. Pre-flight schema check failed and the data-ingest endpoints were NEVER called: status='failed', failure_stage='schema_table'|'schema_column', failure_detail=<precise missing table/column name, for logs only — not shown to the tenant verbatim>.

        2. The cycle ran to completion (success or partial): status='success'|'partial', plus the rows_* counters already returned by the data-ingest endpoints' own responses. This call exists purely so a SyncRun audit record exists even when nothing went wrong, giving the تنظیم API page a real 'last synced at' timestamp.
      summary: Report the outcome of a sync cycle
      tags:
      - Sync (ETL)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncReportRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SyncReportRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SyncReportRequest'
        required: true
      security:
      - syncApiKeyAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncReportRecordedResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/uploads/jobs/{job_id}/:
    get:
      operationId: uploads_jobs_retrieve
      description: 'Poll this endpoint to track an async upload started by any of
