      - خیلی پایین
      type: string
      description: |-
        * `خیلی بالا` - خیلی بالا
        * `بالا` - بالا
        * `متوسط` - متوسط
        * `پایین` - پایین
        * `خیلی پایین` - خیلی پایین
    Register:
