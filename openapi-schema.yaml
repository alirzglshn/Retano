    SMSPackagesResponse:
      type: object
      description: |-
        GET /api/v1/sms/packages/. All price arithmetic for the purchase UI
        happens client-side from this config — the backend never computes,
        validates, or stores a price anywhere.
      properties:
        price_per_sms:
          type: integer
          description: Tomans, before any discount.
        slider:
          $ref: '#/components/schemas/SMSSliderRange'
        discount_tiers:
          type: array
          items:
            $ref: '#/components/schemas/SMSDiscountTier'
          description: Evaluate top-to-bottom (highest min_sms first); the first tier
            whose min_sms the selected sms_count meets or exceeds wins.
      required:
      - discount_tiers
      - price_per_sms
      - slider
    SMSSliderRange:
