          - $ref: '#/components/schemas/NullEnum'
        campaign_start_date:
          type: string
          format: date
          nullable: true
        campaign_end_date:
          type: string
          format: date
          nullable: true
        send_sms_time:
          type: string
          format: time
        activation_base:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/ActivationBaseEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        comparison_type:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/ComparisonTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        comparison_value:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        value_unit:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/ValueUnitEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        buying_power:
          $ref: '#/components/schemas/BuyingPowerEnum'
        customer_type:
          $ref: '#/components/schemas/CustomerTypeEnum'
        gender:
          $ref: '#/components/schemas/GenderEnum'
        first_product_attribute:
          type: string
          title: ویژگی اول محصول
          maxLength: 255
        second_product_attribute:
          type: string
          title: ویژگی دوم محصول
          maxLength: 255
        description:
          type: string
        is_active:
          type: boolean
        message_pattern:
          type: string
          minLength: 1
      required:
      - name
    CampaignToggle:
      type: object
      description: Body for PATCH /api/v1/campaigns/{id}/toggle/ — is_active only.
      properties:
        id:
          type: integer
          readOnly: true
        is_active:
          type: boolean
      required:
      - id
    ChatResponse:
      type: object
      description: |-
        Full {thread_id, messages} shape for GET /api/v1/tickets/chat/ and
        GET /api/v1/tickets/support/{tenant_id}/, extending the thread_id-only
        base declared in core/serializers_schema.py with the real
        tickets.serializers.MessageSerializer.
      properties:
        thread_id:
          type: integer
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
      required:
      - messages
      - thread_id
    ChoiceOption:
      type: object
      description: One {value, label} pair, as used throughout CampaignMetaView.
      properties:
        value:
          type: string
          description: The raw value to submit back to the API. Usually a string,
            except for coupon_discount_percentage where it is an integer 0-100 (see
